[build-system]
requires = ["hatchling>=1.27,<1.33"]
build-backend = "hatchling.build"

# Component identity only: shipped inside the single simplicio-loop wheel, never published on its own.
[project]
name = "simplicio-mapper"
version = "0.26.34"
description = "Python-first project mapper that emits .simplicio-loop/project-map.json and precedent-index.json for the Simplicio ecosystem."
readme = "PYPI.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Wesley Simplicio", email = "wesleybob4@gmail.com" }]
keywords = ["simplicio", "mapper", "llm", "project-map", "precedent", "agent"]
classifiers = [
  "Private :: Do Not Upload",  # built into the simplicio-loop wheel; PyPI rejects uploads of this
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "orjson>=3.11.9,<4",
  "diskcache>=5.6.3,<6",
  "tiktoken>=0.12.0,<1",
]

[project.optional-dependencies]
release = [
  "cryptography>=43,<51",
]
dev = [
  "cryptography>=43,<51",
  "ruff>=0.15,<0.17",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "hypothesis>=6.100,<7",
  "build>=1,<2",
  # Build backend (see [build-system] above). The dist-frontier tests build
  # a real wheel with `python -m build --no-isolation` to prove the
  # committed contracts/wheel-force-include shape without touching the
  # network for an isolated build env -- that requires hatchling to already
  # be importable in the dev environment, not just declared as a PEP 517
  # build requirement.
  "hatchling>=1.27,<1.33",
]

[project.scripts]
simplicio-mapper = "simplicio_mapper.cli:main"
llm-project-mapper = "simplicio_mapper.cli:main"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[project.urls]
Homepage = "https://github.com/simpletibr/simplicio-loop/tree/main/packages/mapper"
Repository = "https://github.com/simpletibr/simplicio-loop/tree/main/packages/mapper"
Issues = "https://github.com/simpletibr/simplicio-loop/issues"

[tool.hatch.build.targets.wheel]
packages = ["simplicio_mapper"]

# Distribution frontier (#199/#200/#208): the versioned contracts tree lives
# at simplicio_mapper/contracts/ -- ordinary in-package data now, so Hatch
# ships it with the package automatically for both a real wheel install and
# an editable/dev install (`pip install -e`). No force-include: that only
# ever worked for a real wheel build, never for editable installs (whose
# finder just points back at the source tree as-is), which is exactly the
# gap that made `simplicio_mapper.contract.find_contract_root()` and
# consumers like simplicio-dev-cli's Mapper graph-delta admission
# unreliable outside a source checkout.

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
  ".simplicio-loop",
  "dist",
  "build",
]

[tool.ruff.lint]
# Rule set is chosen to match the `# noqa` codes already used in the
# codebase (S = bandit-style security checks, BLE = blind exception)
# plus standard hygiene families that do not require sweeping rewrites.
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "B",   # flake8-bugbear
  "BLE", # flake8-blind-except
  "S",   # flake8-bandit
  "UP",  # pyupgrade
]
ignore = [
  "E501",   # line length handled by formatter / project style
  "S101",   # pytest uses assert
  "S311",   # non-crypto randomness is fine in mapper heuristics
  "S603",   # subprocess calls only run fixed argv with project-controlled inputs
  "S607",   # `git` is intentionally resolved from PATH on host
  "UP007",  # keep `Optional[...]` style optional for stdlib 3.10 compat
  "UP045",  # keep `Optional[...]` style optional for stdlib 3.10 compat
  "B008",   # default mutable factories are intentional in CLI signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.sdist]
include = [
  "simplicio_mapper",
  "PYPI.md",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]
