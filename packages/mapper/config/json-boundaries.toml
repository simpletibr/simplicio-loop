version = 1
policy = "internal-json-deny"

[scanner]
internal_roots = [".simplicio-loop"]
formats = [".json", ".jsonl", ".ndjson"]

# These are legacy artifacts retained only for the bounded migration window.
# Every entry is exact (no glob is allowed) and must be removed when the
# corresponding Runtime HBI/HBP contract is available in the published CLI.
[[exceptions]]
path = ".simplicio-loop/architecture-inventory.json"
category = "legacy-internal"
target = "hbi"
owner = "mapper"
reason = "migrate read-mostly architecture index to Runtime HBI v1"
expires = "2026-09-30"

