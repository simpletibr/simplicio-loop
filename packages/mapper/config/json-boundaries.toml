version = 1
policy = "internal-json-deny"

[scanner]
internal_roots = [".simplicio-loop"]
formats = [".json", ".jsonl", ".ndjson"]

# No exceptions are declared: ".simplicio-loop/" is gitignored, generated
# runtime state (see .gitignore) and nothing under it is ever checked into
# this repository. The prior "bounded migration window" exceptions here
# pointed at JSON files that were removed from git by
# "chore(mapper): drop generated/dogfood artifacts from git, re-baseline
# repository size budget" and never came back, so they were permanently
# STALE_EXCEPTION findings. A new checked-in artifact under an internal root
# should not happen; if one is ever legitimately needed, add a fresh,
# dated exception here rather than resurrecting one of the removed entries.
