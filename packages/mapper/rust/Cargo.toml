[workspace]
members = ["mapper-core", "runtime-adapter"]
resolver = "2"

[package]
name = "simplicio_mapper_rs"
version = "0.1.0"
edition = "2021"
description = "PyO3 acceleration crate for simplicio-mapper (hashing + parsing hot paths)"
license = "MIT"

[lib]
name = "simplicio_mapper_rs"
crate-type = ["cdylib"]

[dependencies]
simplicio-mapper-core = { path = "mapper-core" }
pyo3 = { version = "0.29", features = ["extension-module"] }
