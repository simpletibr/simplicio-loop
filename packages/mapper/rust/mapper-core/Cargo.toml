[package]
name = "simplicio-mapper-core"
version = "0.1.0"
edition = "2021"
description = "Pure deterministic semantic kernels shared by Simplicio Mapper adapters"
license = "MIT"

[lib]
name = "simplicio_mapper_core"

[dependencies]
once_cell = "1.19"
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
