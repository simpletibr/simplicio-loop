name: Publish Python package

on:
  pull_request:
    paths:
      - ".github/workflows/publish-pypi.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "pyproject.toml"
      - "src/simplicio_fast/__init__.py"
      - "rust/simplicio-fast-core/Cargo.toml"
      - "scripts/check_release_integrity.py"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check build twine
      - name: Validate release metadata
        run: python scripts/check_release_integrity.py --check --json
      - name: Require matching release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI with OIDC
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
