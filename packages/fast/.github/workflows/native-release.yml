name: Native release artifacts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish PyPI and promote the GitHub release after every gate passes.
        required: true
        default: false
        type: boolean
      tag:
        description: Release tag to build, for example v2.0.27.
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/native-release.yml"
      - "scripts/**"
      - "native/fast-native/**"
      - "rust/simplicio-fast-core/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate publication contract
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate native contracts and release asset gate
        run: |
          python -m pytest -q \
            tests/test_native_bundle_211.py \
            tests/test_fast_core_bundle.py \
            tests/test_native_release_workflow_211.py \
            tests/test_release_assets_482.py
      - name: Validate release metadata and ownership policy
        run: python scripts/check_release_integrity.py --check --json

  package:
    name: Build and attest Python package
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: contract
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release ref
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            ref="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
            ref="$PUSH_REF"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "ref=$ref"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 1

      - name: Capture source commit
        id: source
        shell: bash
        run: echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1" "twine==5.1.1"

      - name: Build Python distributions
        run: python -m build --outdir dist

      - name: Run pre-publication asset digest gate
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          python scripts/check_release_assets.py \
            --dist dist \
            --expected-version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --write-manifest release-assets.json \
            --json
          python -m twine check dist/*

      - name: Upload package and digest manifest
        uses: actions/upload-artifact@v4
        with:
          name: python-release-${{ steps.release.outputs.version }}
          path: |
            dist
            release-assets.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.platform }}
    needs: contract
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            compatibility_filename: simplicio-fast-native
            core_filename: simplicio-fast-rs
            linker: ""
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            compatibility_filename: simplicio-fast-native
            core_filename: simplicio-fast-rs
            linker: aarch64-linux-gnu-gcc
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-aarch64
            compatibility_filename: simplicio-fast-native
            core_filename: simplicio-fast-rs
            linker: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            compatibility_filename: simplicio-fast-native.exe
            core_filename: simplicio-fast-rs.exe
            linker: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure cross linker
        if: matrix.linker != ''
        shell: bash
        run: |
          target_key="$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')"
          echo "CARGO_TARGET_${target_key}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
      - id: package
        name: Read canonical package version
        shell: bash
        run: |
          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require matching release tag
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        shell: bash
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ "$EXPECTED_TAG" == "$GITHUB_REF_NAME" ]]; then
            test "$GITHUB_REF_NAME" = "v${{ steps.package.outputs.version }}"
          else
            test "$EXPECTED_TAG" = "v${{ steps.package.outputs.version }}"
          fi
      - name: Build compatibility CLI in CI
        run: cargo build --manifest-path native/fast-native/Cargo.toml --release --target ${{ matrix.target }}
      - name: Build Rust-core CLI in CI
        run: cargo build --manifest-path rust/simplicio-fast-core/Cargo.toml --release --target ${{ matrix.target }}
      - name: Stage and verify precompiled artifact
        shell: bash
        run: |
          set -euo pipefail
          compatibility_abi_dir="simplicio.fast-native_v1"
          core_abi_dir="simplicio.fast-core_v1"
          output="dist/${{ matrix.platform }}"
          mkdir -p "$output/$compatibility_abi_dir" "$output/$core_abi_dir"
          cp "native/fast-native/target/${{ matrix.target }}/release/${{ matrix.compatibility_filename }}" "$output/$compatibility_abi_dir/${{ matrix.compatibility_filename }}"
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.core_filename }}" "$output/$core_abi_dir/${{ matrix.core_filename }}"
          python scripts/build_native_manifest.py \
            --binary "$output/$compatibility_abi_dir/${{ matrix.compatibility_filename }}" \
            --platform "${{ matrix.platform }}" \
            --version "${{ steps.package.outputs.version }}" \
            --source-commit "$(git rev-parse HEAD)" \
            --toolchain "$(rustc --version)" \
            --output "$output/$compatibility_abi_dir/manifest.json"
          python scripts/verify_native_bundle.py \
            --root "$output" \
            --expected-platform "${{ matrix.platform }}" \
            --expected-version "${{ steps.package.outputs.version }}" \
            --json
          cargo run --quiet --manifest-path rust/simplicio-fast-core/Cargo.toml -- --version --json > "$output/$core_abi_dir/engine-manifest.json"
          python scripts/verify_fast_core_bundle.py \
            --binary "$output/$core_abi_dir/${{ matrix.core_filename }}" \
            --manifest "$output/$core_abi_dir/engine-manifest.json" \
            --expected-version "${{ steps.package.outputs.version }}" \
            --json
      - uses: actions/upload-artifact@v4
        with:
          name: simplicio-fast-engines-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30

  verify-python:
    name: Verify Python publication artifact
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-release-${{ needs.package.outputs.version }}
          path: release
      - name: Verify immutable Python artifact and manifest
        run: |
          python scripts/check_release_assets.py \
            --dist release/dist \
            --expected-version "${{ needs.package.outputs.version }}" \
            --source-commit "${{ needs.package.outputs.source_commit }}" \
            --verify-manifest release/release-assets.json \
            --json

  verify-native:
    name: Verify native ${{ matrix.platform }}
    needs: [package, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64, macos-aarch64, windows-x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: simplicio-fast-engines-${{ matrix.platform }}
          path: release/${{ matrix.platform }}
      - name: Verify native compatibility manifest
        run: |
          python scripts/verify_native_bundle.py \
            --root "release/${{ matrix.platform }}" \
            --expected-platform "${{ matrix.platform }}" \
            --expected-version "${{ needs.package.outputs.version }}" \
            --json
      - name: Verify Rust core manifest and digest
        shell: bash
        run: |
          set -euo pipefail
          binary="$(find "release/${{ matrix.platform }}/simplicio.fast-core_v1" -maxdepth 1 -type f ! -name 'engine-manifest.json' -print -quit)"
          python scripts/verify_fast_core_bundle.py \
            --binary "$binary" \
            --manifest "release/${{ matrix.platform }}/simplicio.fast-core_v1/engine-manifest.json" \
            --expected-version "${{ needs.package.outputs.version }}" \
            --json

  publish:
    name: Publish and promote verified release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: [package, verify-python, verify-native]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-release-${{ needs.package.outputs.version }}
          path: release
      - name: Re-run Python digest gate on immutable artifact
        run: |
          python scripts/check_release_assets.py \
            --dist release/dist \
            --expected-version "${{ needs.package.outputs.version }}" \
            --source-commit "${{ needs.package.outputs.source_commit }}" \
            --verify-manifest release/release-assets.json \
            --json
      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/dist
          skip-existing: true
          attestations: true
      - name: Verify PyPI asset digests before promotion
        run: |
          python scripts/check_release_assets.py \
            --dist release/dist \
            --expected-version "${{ needs.package.outputs.version }}" \
            --source-commit "${{ needs.package.outputs.source_commit }}" \
            --verify-manifest release/release-assets.json \
            --pypi-url "https://pypi.org/pypi/simplicio-fast/json" \
            --pypi-retries 24 \
            --pypi-delay 5 \
            --json
      - name: Download verified native artifacts
        uses: actions/download-artifact@v4
        with:
          name: simplicio-fast-engines-linux-x86_64
          path: release/native/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: simplicio-fast-engines-linux-aarch64
          path: release/native/linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: simplicio-fast-engines-macos-aarch64
          path: release/native/macos-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: simplicio-fast-engines-windows-x86_64
          path: release/native/windows-x86_64
      - name: Package immutable native release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for platform in linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64; do
            tar -C "release/native/$platform" -czf "release-assets/simplicio-fast-$platform.tar.gz" .
          done
      - name: Promote GitHub release after all digest gates pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.package.outputs.source_commit }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/*.tar.gz \
            release/dist/*.whl \
            release/dist/*.tar.gz \
            --clobber
