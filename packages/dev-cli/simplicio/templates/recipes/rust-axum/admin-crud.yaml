{
  "name": "admin-crud",
  "description": "Axum admin-only JSON CRUD routes for one resource.",
  "applies_to": ["rust-axum"],
  "matches": [
    "(?i)\\badmin\\s+(?:panel|dashboard)\\s+(?:for|to\\s+manage)\\s+(?P<entity>[A-Za-z][A-Za-z0-9_-]*)\\b",
    "(?i)\\badmin\\s+CRUD\\s+(?:for\\s+)?(?P<entity>[A-Za-z][A-Za-z0-9_-]*)\\b",
    "(?i)\\badmin\\s+for\\s+(?P<entity>[A-Za-z][A-Za-z0-9_-]*)\\b",
    "(?i)\\bbackoffice\\s+(?:for|to\\s+manage)\\s+(?P<entity>[A-Za-z][A-Za-z0-9_-]*)\\b"
  ],
  "slots": {
    "entity": {"required": true, "transform": "pascal_case"},
    "entity_lower": {"derived_from": "entity", "transform": "lower_snake_case"},
    "entity_plural": {"derived_from": "entity", "transform": "plural_lower"}
  },
  "rationale": "Use the rust-axum admin CRUD recipe for {entity}: admin extractor and route tests are deterministic.",
  "files_to_create": [
    {"path": "src/main.rs", "purpose": "Axum admin router, CRUD handlers, and route tests for {entity}"}
  ],
  "tasks": [
    {
      "id": "T01-axum-admin-crud",
      "depends_on": [],
      "goal": "Implement admin-only Axum CRUD routes for {entity}.",
      "target": "src/main.rs",
      "criteria": "- route nest is /admin/{entity_plural}\\n- admin extractor or middleware protects every route\\n- route tests cover allowed and denied requests",
      "constraints": "- keep the service self-contained and typed",
      "verify": "cargo test"
    }
  ],
  "deps_to_install": [],
  "deps_dev": [],
  "test_command": "cargo test",
  "lint_command": "cargo clippy --all-targets -- -D warnings"
}
