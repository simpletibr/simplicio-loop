name: Release train — promote

on:
  workflow_run:
    workflows: ["Release train — gate"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'release-train/')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge only after the gate is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "${{ github.event.workflow_run.head_branch }}" \
            --state open --json number --jq '.[0].number // ""')
          if [ -z "$pr" ]; then
            echo 'No open release-train PR remains.'
            exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
