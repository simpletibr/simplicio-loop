    <rect width="1000" height="280" rx="16" fill="url(#bgLoop)" stroke="#1E293B" stroke-width="2"/>
    <text x="36" y="40" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">⚡ The 50 Points of Simplicio-Loop Protocol Execution</text>
    <text x="36" y="62" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Deterministic 5-phase engineering pipeline enforced during inference</text>
    
        <rect x="36" y="90" width="172" height="160" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <rect x="36" y="90" width="172" height="6" rx="3" fill="url(#p1)"/>
        <text x="48" y="116" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">PHASE I</text>
        <text x="48" y="136" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700"><orient></text>
        <text x="48" y="158" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">State Mapping</text>
        <text x="48" y="176" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Points 1-10</text>
        <foreignObject x="46" y="186" width="152" height="54">
            <p xmlns="http://www.w3.org/1999/xhtml" style="color: #94A3B8; font-family: -apple-system, sans-serif; font-size: 11px; margin: 0; line-height: 1.3;">AST & symbol introspection, zero ghost assumptions</p>
        </foreignObject>
        
            <text x="211" y="174.0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">➔</text>
            
        <rect x="224" y="90" width="172" height="160" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <rect x="224" y="90" width="172" height="6" rx="3" fill="url(#p2)"/>
        <text x="236" y="116" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">PHASE II</text>
        <text x="236" y="136" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700"><plan></text>
        <text x="236" y="158" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Decomposition</text>
        <text x="236" y="176" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Points 11-20</text>
        <foreignObject x="234" y="186" width="152" height="54">
            <p xmlns="http://www.w3.org/1999/xhtml" style="color: #94A3B8; font-family: -apple-system, sans-serif; font-size: 11px; margin: 0; line-height: 1.3;">Atomic tasks, rollback handles, contract hierarchy</p>
        </foreignObject>
        
            <text x="399" y="174.0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">➔</text>
            
        <rect x="412" y="90" width="172" height="160" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <rect x="412" y="90" width="172" height="6" rx="3" fill="url(#p3)"/>
        <text x="424" y="116" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">PHASE III</text>
        <text x="424" y="136" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700"><patch></text>
        <text x="424" y="158" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Surgical Diff</text>
        <text x="424" y="176" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Points 21-30</text>
        <foreignObject x="422" y="186" width="152" height="54">
            <p xmlns="http://www.w3.org/1999/xhtml" style="color: #94A3B8; font-family: -apple-system, sans-serif; font-size: 11px; margin: 0; line-height: 1.3;">Atomic search/replace chunks, AST & indent lock</p>
        </foreignObject>
        
            <text x="587" y="174.0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">➔</text>
            
        <rect x="600" y="90" width="172" height="160" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <rect x="600" y="90" width="172" height="6" rx="3" fill="url(#p4)"/>
        <text x="612" y="116" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">PHASE IV</text>
        <text x="612" y="136" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700"><validate></text>
        <text x="612" y="158" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Auto-Correction</text>
        <text x="612" y="176" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Points 31-40</text>
        <foreignObject x="610" y="186" width="152" height="54">
            <p xmlns="http://www.w3.org/1999/xhtml" style="color: #94A3B8; font-family: -apple-system, sans-serif; font-size: 11px; margin: 0; line-height: 1.3;">Unit tests, compiler feedback loop, anti-placebo</p>
        </foreignObject>
        
            <text x="775" y="174.0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">➔</text>
            
        <rect x="788" y="90" width="172" height="160" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <rect x="788" y="90" width="172" height="6" rx="3" fill="url(#p5)"/>
        <text x="800" y="116" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">PHASE V</text>
        <text x="800" y="136" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700"><deliver></text>
        <text x="800" y="158" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Verification</text>
        <text x="800" y="176" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Points 41-50</text>
        <foreignObject x="798" y="186" width="152" height="54">
            <p xmlns="http://www.w3.org/1999/xhtml" style="color: #94A3B8; font-family: -apple-system, sans-serif; font-size: 11px; margin: 0; line-height: 1.3;">Token pruning, cleanup, VERIFIED_GREEN contract</p>
        </foreignObject>
        
</svg>