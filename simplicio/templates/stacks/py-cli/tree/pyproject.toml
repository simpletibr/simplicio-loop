[project]
name = "{project_name}"
version = "0.1.0"
description = "{goal}"
requires-python = ">=3.12"
dependencies = ["typer>=0.26.5", "rich>=15.0.0"]

[project.scripts]
app = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "ruff>=0.15.15"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
