[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplicio-loop"
version = "3.48.1"
description = "Standalone orchestrator for mapper and simplicio-dev-cli. No Runtime."
readme = "PYPI.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Wesley Simplicio", email = "wesleybob4@gmail.com" }]
keywords = ["ai", "agent", "orchestrator", "llm", "claude", "cursor", "automation", "ralph-loop", "token-economy", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
  "Operating System :: OS Independent",
]
# Loop is the aggregate of mapper + simplicio-dev-cli (issue #1343 removed
# the Fast operator from the stack entirely). `simplicio-cli` exports the
# `simplicio-dev-cli` entrypoint. There is no Runtime and no
# simplicio-prompt on this train. Loop's in-process dev-cli capability probe
# (strict_mode.action_operator_status) reads simplicio.capabilities, hence
# the simplicio-cli floor raise to 0.18.16.
dependencies = [
  "tiktoken>=0.12.0,<1",
  # mapper (survey) + dev-cli (mutation) ship inside this wheel; their runtime deps:
  "numpy>=2.1.0",
  "httpx>=0.28.1",
  "orjson>=3.11.9,<4",
  "diskcache>=5.6.3,<6",
  "libcst>=1.8.6",
  # receipt schema checks in the Simplicio Live drill-down (issue #1405, slice 1405c)
  "jsonschema>=4,<5",
]

# Optional: the real embedding backend for `simplicio-cli semantic --ml` / `simplicio-cli rag --ml`.
# The native engine itself is stdlib-only; this only enables embedding-based semantic dedup +
# meaning retrieval. `pip install "simplicio-loop[ml]"`.
[project.optional-dependencies]
# Dev/test dependencies used by the local quality gate and secure-transport fixtures.
dev = ["setuptools>=77", "pytest>=7", "pytest-cov>=4", "cryptography>=42,<50", "pyyaml"]
ml = ["model2vec>=0.3", "numpy>=1.21"]
uvloop = ["uvloop>=0.19; platform_system != 'Windows'"]
# Browser e2e + axe-core for the Simplicio Live components (tests/test_live_components_e2e_system.py).
e2e = ["playwright>=1.40", "axe-playwright-python>=0.1.4"]
# Langfuse exporter (issue #1595), opt-in via langfuse_enabled in loop.toml. It needs no third-party
# package: it speaks OTLP/JSON and the scores API over stdlib HTTP. The extra is the install switch.
langfuse = []

[project.urls]
Homepage = "https://github.com/simpletibr/simplicio-loop"
Repository = "https://github.com/simpletibr/simplicio-loop"
Issues = "https://github.com/simpletibr/simplicio-loop/issues"

[project.scripts]
# The thin client: it sends the command to the daemon (issue #1590). SIMPLICIO_LOOP_DAEMON=0 runs it in-process.
simplicio-loop = "simplicio_loop.daemon.client:main"
issue-factory = "simplicio_loop.issue_factory_cli:main"
simplicio-ecosystem-doctor = "simplicio_loop.ecosystem_doctor:main"
simplicio-loop-tools = "simplicio_loop.consumer_cli:main"
# issue #516: observability/enforcement CLI for the #498 process-supervisor contract
# (status/top/queue/cancel/drain/reports over the #514 ProcessSpec/Lease/Result adapter).
simplicio-process-supervisor = "simplicio_loop.process_enforcement_cli:main"
simplicio-loop-stack = "simplicio_loop.stack_manifest:main"
simplicio-capabilities = "simplicio_loop.capability_catalog:main"
simplicio-route = "simplicio_loop.route:main"
# packages/mapper (survey) and packages/dev-cli (mutation) are built into this same wheel.
simplicio-mapper = "simplicio_mapper.cli:main"
llm-project-mapper = "simplicio_mapper.cli:main"
simplicio-dev-cli = "simplicio.cli:main"
simplicio-cli = "simplicio.cli:main"
simplicio-py = "simplicio.cli:main"
simplicio-codex-wrapper = "simplicio.codex_wrapper:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "packages/mapper", "packages/dev-cli"]
include = ["simplicio_loop*", "simplicio_mapper*", "simplicio", "simplicio.*"]
namespaces = true

[tool.setuptools.package-data]
simplicio_loop = ["_bundle/**/*", "_contracts/**/*.json", "_catalog/*.json", "setup_pins.json"]
"simplicio_loop._bundle" = ["**/*"]
"simplicio_loop._contracts" = ["**/*.json", "*.json"]
"simplicio_loop._catalog" = ["*.json"]
# Simplicio Live web components + catalog (issue #1399): static files served as-is, no build step.
"simplicio_loop.dashboard" = ["static/**/*", "prices.json"]
# every non-Python file of the merged packages (contracts, schemas, templates, fixtures) ships
simplicio = ["**/*", "**/.*"]
simplicio_mapper = ["**/*", "**/.*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]", "**/.DS_Store"]

[tool.coverage.run]
source = ["simplicio_loop"]
omit = [
  "simplicio_loop/_bundle/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
  "external_integration: installed or network-backed lane excluded from the hermetic core gate",
  "satellite: opt-in satellite functionality excluded from the mandatory core gate",
  "no_survey: apply tests that must run without the seeded Mapper survey",
  "real_squad_review: the module tests the real squad_review.evaluate (the autouse fake of tests/conftest.py is off)",
]
# The bundle/plugin trees mirror source files and are validated by mirror-parity.
# Collect the canonical tests once instead of executing mirrored probes repeatedly.
testpaths = ["tests"]
