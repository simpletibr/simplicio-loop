[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplicio-loop"
version = "3.43.11"
description = "The Universal Looping AI Orchestrator — a runtime-agnostic super-plugin (7 skills) that drains any queue of work end-to-end on any LLM/runtime."
readme = "PYPI.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Wesley Simplicio", email = "wesleybob4@gmail.com" }]
keywords = ["ai", "agent", "orchestrator", "llm", "claude", "cursor", "automation", "ralph-loop", "token-economy", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
  "Operating System :: OS Independent",
]
# The loop ships with its two bound operators and the Prompt contract runtime as
# direct dependencies. `simplicio-cli` is the distribution that exports the
# `simplicio-dev-cli` entrypoint. Do not rely on transitive installs: partial /
# no-deps installations must be diagnosed explicitly and normal
# `pip install simplicio-loop` must request the complete route -> enrichment
# closure.
dependencies = [
  # Loop is the aggregate distribution. Keep one tested component train.
  "simplicio-cli>=0.18.12,<0.19",
  "simplicio-mapper>=0.26.31,<0.27",
  "simplicio-fast>=2.0.32,<3",
  "simplicio-prompt>=1.14.4,<1.15",
  "tiktoken>=0.12.0,<1",
]

# Optional: the real embedding backend for `simplicio-cli semantic --ml` / `simplicio-cli rag --ml`.
# The native engine itself is stdlib-only; this only enables embedding-based semantic dedup +
# meaning retrieval. `pip install "simplicio-loop[ml]"`.
[project.optional-dependencies]
# Dev/test dependencies used by the local quality gate and secure-transport fixtures.
dev = ["setuptools>=77", "pytest>=7", "pytest-cov>=4", "cryptography>=42,<50", "jsonschema>=4,<5"]
ml = ["model2vec>=0.3", "numpy>=1.21"]
uvloop = ["uvloop>=0.19; platform_system != 'Windows'"]

[project.urls]
Homepage = "https://github.com/wesleysimplicio/simplicio-loop"
Repository = "https://github.com/wesleysimplicio/simplicio-loop"
Issues = "https://github.com/wesleysimplicio/simplicio-loop/issues"

[project.scripts]
simplicio = "simplicio_loop.savings_cli:main"
simplicio-loop = "simplicio_loop.cli:main"
issue-factory = "simplicio_loop.issue_factory_cli:main"
simplicio-ecosystem-doctor = "simplicio_loop.ecosystem_doctor:main"
simplicio-loop-tools = "simplicio_loop.consumer_cli:main"
simplicio-hub = "simplicio_loop.hub_daemon:main"
# issue #286 step 11: the multi-device remote-worker protocol's server + worker + supervisor
# are genuinely installable binaries, not source that only runs from a git checkout.
simplicio-remote-queue-server = "simplicio_loop.remote_queue_server_cli:main"
simplicio-remote-worker = "simplicio_loop.remote_worker_cli:main"
simplicio-remote-worker-supervisor = "simplicio_loop.remote_worker_supervisor_cli:main"
# issue #516: observability/enforcement CLI for the #498 process-supervisor contract
# (status/top/queue/cancel/drain/reports over the #514 ProcessSpec/Lease/Result adapter).
simplicio-process-supervisor = "simplicio_loop.process_enforcement_cli:main"
simplicio-loop-stack = "simplicio_loop.stack_manifest:main"
simplicio-capabilities = "simplicio_loop.capability_catalog:main"
simplicio-route = "simplicio_loop.route:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["simplicio_loop*"]
namespaces = true

[tool.setuptools.package-data]
simplicio_loop = ["_bundle/**/*", "_contracts/**/*.json", "_catalog/*.json"]
"simplicio_loop._bundle" = ["**/*"]
"simplicio_loop._contracts" = ["**/*.json", "*.json"]
"simplicio_loop._catalog" = ["*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.coverage.run]
source = ["simplicio_loop"]
omit = [
  "simplicio_loop/_bundle/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
  "external_integration: installed or network-backed lane excluded from the hermetic core gate",
  "satellite: opt-in satellite functionality excluded from the mandatory core gate",
]
# The bundle/plugin trees mirror source files and are validated by mirror-parity.
# Collect the canonical tests once instead of executing mirrored probes repeatedly.
testpaths = ["tests"]
