# Python + Rust CI — pytest matrix for the Python package + cargo test
# (and a maturin build smoke check) for the optional Rust acceleration crate.
# Complements scaffold-self-check.yml (Node) and python-lint.yml (ruff).

name: Python + Rust CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: python-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git identity (for fixture commits)
        run: |
          git config --global user.email "ci@simplicio.dev"
          git config --global user.name "Simplicio CI"
          git config --global commit.gpgsign false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node.js (parity tests run both runtimes)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      - name: Run pytest with coverage gate
        run: python -m pytest tests/python -q --cov=simplicio_mapper --cov-report=term --cov-fail-under=88

      - name: TOON-CONTRACT drift check (issue #149)
        run: python scripts/sync_toon_contract.py check

      - name: SIMPLICIO_ECOSYSTEM.md freshness check (issue #156)
        run: python scripts/generate-ecosystem-doc.py --check

      - name: mapper-artifacts contract check (issue #157)
        run: python scripts/regen_contract_fixtures.py check

      - name: ecosystem contract check (issue #164)
        run: python -m simplicio_mapper.cli doctor --contracts

      - name: Token/context budget guard (issue #174)
        run: python3 scripts/token_budget.py --check

  rust-tests:
    name: cargo test (PyO3 crate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}

      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: maturin develop + native parity test
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e . maturin pytest
          (cd rust && maturin develop --release)
          python -m pytest tests/python/test_native.py -q

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pip-audit
          npm ci

      - name: Run pip-audit
        run: python -m pip_audit

      - name: Run npm audit (high+)
        run: npm audit --audit-level=high
