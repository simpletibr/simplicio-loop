name: Mapper Fastest Path installed matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.14"}
          - {os: macos-latest, python: "3.10"}
          - {os: macos-latest, python: "3.14"}

    steps:
      - name: Check out release ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install build tools and project dependencies
        run: python -m pip install --upgrade build && python -m pip install .

      - name: Build and install clean wheel
        shell: bash
        run: |
          rm -rf dist
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob
          import subprocess
          import sys

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--force-reinstall", wheels[0]])
          PY

      - name: Installed CLI and Python-only smoke
        shell: bash
        run: |
          simplicio-mapper --version --json
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          root = pathlib.Path(tempfile.mkdtemp())
          (root / "main.py").write_text("def main():\n    return 1\n", encoding="utf-8")
          command = ["simplicio-mapper", "index", str(root), "--json"]
          normal = json.loads(subprocess.check_output(command, text=True))
          assert normal["status"] in {"updated", "skipped"}, normal
          env = os.environ.copy()
          env["SIMPLICIO_MAPPER_NO_ASYNC_PIPELINE"] = "1"
          fallback = json.loads(subprocess.check_output(command, text=True, env=env))
          assert fallback["status"] in {"updated", "skipped"}, fallback
          assert fallback["error"] is None, fallback
          PY

      - name: Rust crate tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Differential shadow gate
        shell: bash
        run: |
          python scripts/mapper_differential.py --repo . --output "$RUNNER_TEMP/mapper-616" --json
          cmp artifacts/mapper-differential.json "$RUNNER_TEMP/mapper-616/mapper-differential.json"
          python scripts/mapper_capability_matrix.py --repo .
