
name: Quality Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify workflow references and thresholds
        run: python scripts/check_workflow_references.py

      - name: Enforce internal JSON migration baseline
        run: python scripts/check_json_boundaries.py --mode baseline

      - name: Run Python tests and produce coverage JSON
        run: >-
          python -m pytest tests/python -q
          --cov=simplicio_mapper
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=85

      - name: Enforce critical-path coverage
        run: >-
          python scripts/critical_coverage_gate.py
          --coverage-json coverage.json
          --global-min 85
          --critical-min 90
          --report-out quality-gate-report.json

      - name: Run Node tests and coverage
        run: npm run test:coverage

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            coverage.json
            quality-gate-report.json
            coverage/coverage-summary.json
          if-no-files-found: warn
