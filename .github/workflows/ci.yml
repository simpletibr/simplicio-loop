# CI pipeline — lint, unit tests com coverage, e E2E Playwright em matriz
# Roda em push (main/develop) e em todo pull_request
#
# Design note: este arquivo é o TEMPLATE de CI que o starter copia para
# repositórios consumidores. No próprio repo `wesleysimplicio/simplicio-mapper`
# todos os jobs aqui são pulados via `if: github.repository != ...` porque o
# starter não tem código de produção pra rodar lint/unit/e2e em formato
# consumer. O CI real deste repo vive em `scaffold-self-check.yml`.

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Evita rodar pipelines duplicados quando push acontece num PR aberto
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.repository != 'wesleysimplicio/simplicio-mapper'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  unit:
    name: Unit tests (node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    if: github.repository != 'wesleysimplicio/simplicio-mapper'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E Playwright (node ${{ matrix.node-version }})
    needs: unit
    runs-on: ubuntu-latest
    if: github.repository != 'wesleysimplicio/simplicio-mapper'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
