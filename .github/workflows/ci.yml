name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-json-release-gate:
    name: Internal JSON release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build
      - name: Reject unclassified internal JSON
        run: python scripts/check_json_boundaries.py --strict
      - name: Build release archives
        run: python -m build
      - name: Reject packaged internal JSON
        run: python scripts/check_json_boundaries.py --strict --artifact-dir dist

  coverage:
    name: Coverage gate (85% global / 90% critical)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run test suite with coverage
        run: >-
          pytest
          --cov=simplicio
          --cov-report=term-missing
          --cov-report=json:coverage.json
      - name: Enforce configured coverage floors
        run: python3 scripts/coverage_gate.py --report coverage.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json
          if-no-files-found: error
          retention-days: 14
