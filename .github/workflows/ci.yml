# CI pipeline for the real product shipped from this repo: the Python
# package `simplicio-cli` (entrypoints `simplicio-cli` / `simplicio-py` /
# `simplicio-dev-cli`). The `python` job is the primary required gate.
#
# History note (#98): this file used to be the generic Node/Playwright
# starter-scaffold template (copied verbatim from the mapper starter) and
# triggered on main/develop even though this repo's actual default branch is
# `master`. Fixed both: branch triggers now include the real default branch,
# and the primary gate now installs+tests the actual Python package instead
# of a starter-kit npm harness. The Playwright starter-kit harness that ships
# inside this repo (`tests/e2e/`, `playwright.config.ts`) still gets
# exercised, but in the isolated `starter-e2e.yml` workflow — it validates the
# template harness, not this package, and must not gate merges to `master`.

name: CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

# Evita rodar pipelines duplicados quando push acontece num PR aberto
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  python:
    name: Python package (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install simplicio-cli (editable, base only) + test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest (tests/python + tests/contracts, per pyproject.toml testpaths)
        run: pytest --junit-xml=junit-${{ matrix.python-version }}.xml

      - name: Check generated docs haven't drifted from pyproject.toml (#101)
        run: python3 scripts/gen_package_interdependence.py --check

      - name: Smoke-test all 3 CLI entrypoints
        run: |
          set -euo pipefail
          for entry in simplicio-py simplicio-cli simplicio-dev-cli; do
            echo "::group::$entry --help"
            "$entry" --help
            echo "::endgroup::"
          done

      - name: Upload pytest JUnit report (#202)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-python-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Coverage gate (85% global / 90% critical, #202)
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install simplicio-cli (editable, base only) + test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest with coverage
        run: >
          pytest
          --cov=simplicio
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
          --cov-report=json:coverage.json

      - name: Enforce coverage gate (85% global, 90% critical modules)
        run: python3 scripts/coverage_gate.py --report coverage.json

      - name: Upload coverage reports (#202)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint + type gate (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install simplicio-cli[dev] (ruff + mypy, #102)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy simplicio
        run: mypy simplicio

      - name: Token/context budget guard (#111)
        run: python3 scripts/token_budget.py --check

  windows-pipeline:
    name: Windows token-budget + pipeline slice
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install simplicio-cli (editable, base only) + test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Token/context budget guard on Windows (#141)
        run: python scripts/token_budget.py --check

      - name: Run Windows-focused pipeline regression slice (#141)
        run: >
          pytest -q
          tests/python/test_token_budget_gate.py
          tests/python/test_pipeline_task_result.py
          tests/python/test_pipeline_fixers.py
          tests/python/test_prompt_retry_flow.py

  extras:
    name: Extras install (${{ matrix.extra }})
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # #99: heavy ML/provider deps live behind extras, not the base
        # install. `providers` is the cheap one to cover in every run;
        # `ml`/`local` pull PyTorch/llama.cpp (~GBs) so they are exercised
        # here too but are not part of the base-install job above.
        extra: [providers, ml]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install simplicio-cli[${{ matrix.extra }}]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extra }}]"

      - name: Verify the extra's imports actually resolve
        run: |
          set -euo pipefail
          case "${{ matrix.extra }}" in
            providers) python -c "import openai, anthropic; print('providers OK')" ;;
            ml) python -c "import sentence_transformers; print('ml OK')" ;;
          esac

  packaging:
    name: Packaging smoke (sdist + wheel + twine check)
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build + twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distributions with twine check
        run: python -m twine check dist/*

      - name: Install built wheel in a clean venv and smoke-test CLI
        run: |
          python -m venv .venv-wheel
          . .venv-wheel/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          SIMPLICIO_SKIP_AUTO_INIT=1 simplicio-py --help

      - name: Upload built distributions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: warn
          retention-days: 14
