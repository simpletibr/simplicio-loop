# Version-sync guard — package.json, pyproject.toml, and __init__.py
# must report the same SemVer string (issue #102).

name: Version Sync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: version-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-sync:
    name: Align package / pyproject / __init__ versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version alignment
        run: python scripts/check-version-sync.py
