name: Release train — report Mapper drift

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Collect the current version report
        run: |
          uv sync --extra dev --frozen
          uv run --frozen simplicio-py versions --json --refresh > /tmp/versions.json
      - name: Open one deduplicated drift issue when justified state is absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          drift=$(python -c "import json; print(str(json.load(open('/tmp/versions.json'))['drift']['has_drift']).lower())")
          if [ "$drift" != "true" ]; then
            echo 'No Mapper drift detected.'
            exit 0
          fi
          title='[release-train] Mapper drift requires reconciliation'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "${title} in:title" --json number --jq '.[0].number // ""')
          if [ -n "$issue" ]; then
            echo "Drift issue #$issue is already open."
            exit 0
          fi
          python - <<'PY' > /tmp/drift-body.md
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/versions.json').read_text())
          print('Automated release-train drift report.')
          print()
          print('The installed Mapper does not match the declared/last-tested state; no justification or verified release receipt was found.')
          print()
          print('```json')
          print(json.dumps(report['drift'], indent=2, sort_keys=True))
          print('```')
          print()
          print('Reconcile through the authenticated Mapper release event workflow; do not edit the lock manually.')
          PY
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/drift-body.md
