# Starter-kit E2E harness validation — Playwright smoke for the
# Node harness shipped inside this repo (tests/e2e/, playwright.config.ts,
# package.json "simplicio-cli-e2e"). This validates the template harness,
# not the simplicio-cli Python package itself.
#
# Deliberately isolated (#98): keep this workflow non-gating and only trigger
# it when the starter harness files change.

name: Starter Kit E2E Harness (non-gating)

on:
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - ".github/workflows/starter-e2e.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tests/e2e/**"
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - ".github/workflows/starter-e2e.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tests/e2e/**"

concurrency:
  group: starter-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true

jobs:
  manifest:
    name: Starter harness manifest smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify harness scripts declared in package.json
        run: |
          node -e "const pkg=require('./package.json'); const required=['test:e2e','test:e2e:ui','test:e2e:report']; const missing=required.filter((name)=>!(pkg.scripts&&pkg.scripts[name])); if(missing.length){console.error('missing scripts:', missing.join(', ')); process.exit(1);} console.log('starter harness scripts OK');"

  e2e:
    name: E2E Playwright (node ${{ matrix.node-version }}, starter harness)
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
