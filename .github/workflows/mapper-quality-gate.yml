name: Mapper quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Enforce internal JSON inventory
        run: python scripts/check_json_boundaries.py --strict
      - name: Python tests
        run: python -m pytest -q
      - name: Node unit tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
      - name: Generate Markdown quality summary
        if: always()
        run: python scripts/mapper_quality_gate.py --output artifacts/mapper-quality-summary.md
      - name: Upload Markdown quality summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapper-quality-${{ matrix.os }}-py${{ matrix.python }}
          path: artifacts/mapper-quality-summary.md

  runtime:
    name: Runtime conformance and release protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install simplicio-runtime
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/wesleysimplicio/simplicio/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Runtime boundary
        run: simplicio ecosystem doctor --repo .
      - name: Require Runtime evidence
        run: python3 scripts/mapper_quality_gate.py --require-runtime --output artifacts/mapper-quality-summary.md
      - name: Upload Runtime quality summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapper-quality-runtime
          path: artifacts/mapper-quality-summary.md
